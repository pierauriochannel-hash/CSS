<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lomas de San Fernando · Ecosistemas frágiles</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="importmap">{ "imports": { "ogl": "https://esm.sh/ogl@1.0.11" } }</script>
<style>
:root{
  --azul-oscuro:#284957; --marron-oscuro:#574728; --celeste-claro:#B4CDD7;
  --beige-neutro:#D6CBB4; --rosa-pastel:#D6C0B4; --blanco:#ffffff;
  --azul-vivo:#2E6E8E;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{ height:100%; overflow-x:hidden; }
body{ font-family:'Inter',sans-serif; background:var(--blanco); color:var(--azul-oscuro);
  line-height:1.5; -webkit-font-smoothing:antialiased; }

.view{ position:fixed; inset:0; width:100%; height:100dvh; opacity:1; visibility:visible;
  transition: opacity 1s cubic-bezier(0.4,0,0.2,1), visibility 1s cubic-bezier(0.4,0,0.2,1);
  overflow:hidden; }
.view.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

/* HERO */
.hero-section{ display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:2rem; position:relative; overflow:hidden;
  background: linear-gradient(180deg, #ffffff 0%, #eaf2f6 50%, #cfe0e8 100%); }
.hero-section::before{ content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 32%,
    rgba(255,255,255,0.85) 48%, rgba(255,255,255,0.55) 64%, rgba(255,255,255,0.15) 82%,
    rgba(255,255,255,0) 100%); z-index:2; pointer-events:none; }
.gradient-waves-wrapper{ position:absolute; top:0;left:0; width:100%; height:100%; z-index:1; display:block; }
.gradient-waves-container{ position:absolute !important; inset:0 !important;
  width:100% !important; height:100% !important; display:block; }
.gradient-waves-wrapper canvas, .gradient-waves-container canvas{
  display:block !important; width:100% !important; height:100% !important;
  position:absolute !important; inset:0 !important; }
.hero-content{ max-width:1000px; text-align:center; z-index:3; position:relative; pointer-events:none; }
.hero-content > *{ pointer-events:auto; }

.fold{ display:inline-block; perspective:900px; transform-style:preserve-3d;
  font-size:clamp(3.5rem,10vw,7rem); font-weight:700; letter-spacing:-0.04em; line-height:0.95;
  color:var(--azul-oscuro); text-shadow: 0 2px 24px rgba(255,255,255,0.85); }
.fold .f-char{ display:inline-block; position:relative; transform-origin:50% 0%;
  transform-style:preserve-3d; backface-visibility:hidden; will-change:transform,opacity;
  opacity:0; transform: rotateX(-92deg);
  transition: transform 0.7s cubic-bezier(.22,.61,.36,1), opacity 0.7s cubic-bezier(.22,.61,.36,1); }
.fold.is-open .f-char{ opacity:1; transform: rotateX(0deg); }
.fold .f-space{ display:inline-block; width:0.3em; }
.fold .f-char::after{ content:''; position:absolute; inset:-0.06em -0.02em; pointer-events:none;
  border-radius:0.06em;
  background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.15) 45%, rgba(255,255,255,0.15) 100%);
  mix-blend-mode:multiply; opacity:0.7; transition:opacity 0.75s ease; }
.fold.is-open .f-char::after{ opacity:0; }

.fold-sub{ display:inline-block; perspective:700px; font-size:clamp(1.25rem,3vw,1.75rem);
  font-weight:500; color:var(--marron-oscuro); letter-spacing:-0.01em; line-height:1.35;
  margin-top:1.25rem; text-shadow: 0 1px 16px rgba(255,255,255,0.9); }
.fold-sub .f-char{ transform-origin:50% 100%; opacity:0; transform: rotateX(92deg);
  transition: transform 0.7s cubic-bezier(.22,.61,.36,1), opacity 0.7s cubic-bezier(.22,.61,.36,1); }
.fold-sub.is-open .f-char{ opacity:1; transform: rotateX(0deg); }

.highlight-quote{ margin: 2rem auto 0; max-width:42rem; font-size:clamp(1.1rem,2.5vw,1.5rem);
  font-weight:400; font-style:italic; color:var(--marron-oscuro); text-align:left;
  border-left:4px solid var(--rosa-pastel); padding:0.85rem 1.5rem;
  background: rgba(255,255,255,0.55); backdrop-filter: blur(4px);
  border-radius: 0 1rem 1rem 0; position:relative; z-index:2; opacity:0; transform: translateY(12px);
  transition: opacity 0.9s ease 1.2s, transform 0.9s ease 1.2s; }
.highlight-quote.is-open{ opacity:1; transform: translateY(0); }

.btn-primary{ display:inline-block; background-color:var(--azul-oscuro); color:#fff;
  font-weight:600; font-size:1.125rem; padding:0.9rem 2.8rem; border-radius:9999px;
  letter-spacing:0.1em; text-transform:uppercase; transition:all .3s ease;
  border:2px solid transparent; cursor:pointer;
  box-shadow: 0 8px 20px -6px rgba(40,73,87,.5); position:relative; z-index:3; }
.btn-primary:hover{ background-color:var(--marron-oscuro); border-color:var(--rosa-pastel);
  transform: translateY(-3px); box-shadow: 0 14px 28px -8px rgba(87,71,40,.7); }
.cta-wrap{ margin-top:2.5rem; display:inline-block; position:relative; }
#spark-canvas{ position:absolute; inset:0; width:100%; height:100%;
  display:block; pointer-events:none; z-index:4; }

@media (prefers-reduced-motion: reduce){
  .view{ transition-duration:.001s !important; }
  .fold .f-char, .fold-sub .f-char, .highlight-quote{ transition-duration:0.001s !important; }
}

/* MAPA */
.map-view{ background: linear-gradient(180deg, #ffffff 0%, #f2f7fa 45%, #dfeaf1 100%); color:var(--azul-oscuro); }
.map-particles-bg{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.particles-container{ position:absolute !important; inset:0 !important;
  width:100% !important; height:100% !important; display:block; }
.map-particles-bg canvas{ display:block !important; width:100% !important; height:100% !important;
  position:absolute !important; inset:0 !important; }
.map-veil{ position:absolute; inset:0; z-index:1; pointer-events:none;
  background: linear-gradient(180deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.35) 45%, rgba(255,255,255,0.55) 100%); }
.map-scroll{ position:absolute; inset:0; z-index:2; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
.map-content{ max-width:1100px; margin:0 auto; padding: 6rem 1.5rem 4rem; }
.map-head{ text-align:center; margin-bottom:3rem; }
.badge{ display:inline-block; background-color:var(--rosa-pastel); color:var(--azul-oscuro);
  font-size:.75rem; font-weight:700; padding:.3rem .95rem; border-radius:9999px;
  letter-spacing:.06em; text-transform:uppercase; }
.map-head h2, .pins-head h2, .nature-head h2, .threats-head h2, .final-head h2{ font-size:clamp(1.8rem,4vw,2.6rem); font-weight:800;
  color:var(--azul-oscuro); letter-spacing:-0.02em; margin:1rem 0 .75rem; }
.map-head p, .pins-head p, .nature-head p, .threats-head p, .final-head p{ color:var(--marron-oscuro); max-width:46rem;
  margin:0 auto; font-size:1.02rem; }
.map-grid{ display:grid; grid-template-columns:minmax(280px,1fr) minmax(280px,1fr);
  gap:3rem; align-items:start; }
@media (max-width:800px){ .map-grid{ grid-template-columns:1fr; gap:2rem; } }
.map-stage{ background:var(--beige-neutro); border:1px solid var(--marron-oscuro);
  border-radius:1.5rem; padding:1rem; box-shadow: 0 10px 30px -12px rgba(87,71,40,.25);
  transition: border-color .3s ease, box-shadow .3s ease; }
.map-stage:hover{ border-color:var(--rosa-pastel); box-shadow: 0 16px 40px -14px rgba(87,71,40,.35); }
.map-frame{ position:relative; width:100%; aspect-ratio:1/1.15; overflow:hidden;
  border-radius:1rem; background:#fff; }
.map-frame img{ position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain; display:block; filter:grayscale(0.1); }
.map-fallback{ position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:2rem; text-align:center;
  color:var(--marron-oscuro); font-size:.85rem; gap:.5rem; background:#f4eee2; }
.map-fallback strong{ color:var(--azul-oscuro); font-size:1rem; }
.map-fallback code{ background:var(--beige-neutro); padding:.2rem .5rem; border-radius:4px;
  font-size:.78rem; border:1px solid var(--marron-oscuro); }
.map-text{ text-align:left; }
.map-text h3{ font-size:1.35rem; font-weight:700; color:var(--azul-oscuro); margin-bottom:1rem; }
.route{ display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; margin-bottom:2rem; }
.route .chip{ background:var(--rosa-pastel); color:var(--azul-oscuro);
  border:1px solid var(--marron-oscuro); border-radius:9999px; padding:.4rem 1rem;
  font-size:.85rem; font-weight:600; }
.route .arrow{ color:var(--rosa-pastel); font-weight:800; font-size:1rem; }
.area-stat{ background:var(--beige-neutro); border:1px solid var(--marron-oscuro);
  border-radius:1.25rem; padding:1.5rem 1.75rem;
  transition: border-color .3s ease, transform .3s ease; }
.area-stat:hover{ border-color:var(--rosa-pastel); transform: translateY(-2px); }
.area-stat .num{ display:block; font-size:clamp(1.9rem,4vw,2.5rem); font-weight:800;
  color:var(--azul-oscuro); letter-spacing:-0.02em; line-height:1.1; }
.area-stat .unit{ display:block; font-size:.8rem; color:var(--marron-oscuro);
  letter-spacing:.14em; text-transform:uppercase; margin-top:.35rem; }
.area-stat .desc{ margin-top:1rem; font-size:.9rem; color:var(--marron-oscuro); }

.info-card{ background:var(--beige-neutro); border:1px solid var(--marron-oscuro);
  border-radius:1.25rem; padding:1.5rem 1.75rem; margin-top:1.25rem;
  transition: border-color .3s ease, transform .3s ease; }
.info-card:hover{ border-color:var(--rosa-pastel); transform: translateY(-2px); }
.info-list{ list-style:none; display:flex; flex-direction:column; gap:.9rem;
  margin:0 0 1.35rem 0; padding:0; }
.info-list li{ display:flex; flex-direction:column; gap:.2rem; }
.info-label{ font-size:.68rem; font-weight:700; color:var(--marron-oscuro);
  letter-spacing:.14em; text-transform:uppercase; }
.info-value{ font-size:.95rem; color:var(--azul-oscuro); font-weight:500; line-height:1.4; }
.info-rating{ padding-top:1.25rem; border-top:1px dashed rgba(87,71,40,.35);
  display:flex; flex-direction:column; gap:.6rem; }
.rating-row{ display:flex; align-items:flex-end; gap:1rem; flex-wrap:wrap; }
.rating-num{ font-size:2.1rem; font-weight:800; color:var(--azul-oscuro);
  letter-spacing:-0.03em; line-height:1; }
.rating-source{ font-size:.72rem; color:var(--marron-oscuro);
  letter-spacing:.08em; text-transform:uppercase; margin-top:.15rem;
  align-self:flex-end; padding-bottom:.15rem; }

.concept-card{ background:#fff; border:1px solid var(--marron-oscuro);
  border-left:5px solid var(--azul-oscuro); border-radius:1.25rem; padding:1.5rem 1.75rem;
  margin-top:1.25rem; transition: border-color .3s ease, transform .3s ease, box-shadow .3s ease;
  box-shadow: 0 6px 18px -12px rgba(40,73,87,.25); }
.concept-card:hover{ border-color:var(--azul-oscuro); border-left-color:var(--rosa-pastel);
  transform: translateY(-2px); box-shadow: 0 12px 28px -14px rgba(40,73,87,.35); }
.concept-card .concept-title{ display:flex; align-items:center; gap:.55rem;
  font-size:.72rem; font-weight:800; color:var(--marron-oscuro);
  letter-spacing:.14em; text-transform:uppercase; margin-bottom:1rem; }
.concept-card .concept-title::before{ content:''; width:8px; height:8px;
  background:var(--rosa-pastel); border-radius:50%; display:inline-block; }
.concept-list{ list-style:none; display:flex; flex-direction:column; gap:1rem; margin:0; padding:0; }
.concept-list li{ padding-left:1rem; border-left:2px dotted rgba(87,71,40,.35); }
.concept-term{ display:block; font-size:.95rem; font-weight:700;
  color:var(--azul-oscuro); margin-bottom:.25rem; letter-spacing:-0.01em; }
.concept-desc{ font-size:.88rem; color:var(--marron-oscuro); line-height:1.5; }

.rs-row{ display:inline-flex; gap:4px; align-items:center; }
.rs-star{ position:relative; display:inline-block; width:var(--rs-size,36px);
  height:var(--rs-size,36px); flex-shrink:0; }
.rs-star svg{ display:block; width:100%; height:100%; }
.rs-star-bg{ color:var(--rs-idle,#D6CBB4); }
.rs-star-fill{ position:absolute; inset:0; color:var(--rs-active,#f5b400);
  clip-path: inset(0 100% 0 0);
  transition: clip-path 480ms cubic-bezier(0.23,1,0.32,1); will-change: clip-path; }

.back-btn, .next-btn{ position:absolute; top:1.5rem; background: rgba(255,255,255,0.9);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  color:var(--azul-oscuro); border:1px solid var(--marron-oscuro); border-radius:9999px;
  padding:.5rem 1.1rem; font-size:.85rem; font-weight:600; cursor:pointer; z-index:20;
  transition: all .25s ease; font-family: inherit; }
.back-btn{ left:1.5rem; }
.next-btn{ right:1.5rem; }
.back-btn:hover, .next-btn:hover{ background:var(--azul-oscuro); border-color:var(--azul-oscuro);
  color:#fff; transform: translateY(-2px); box-shadow: 0 8px 18px -8px rgba(40,73,87,.6); }

/* PINS */
.pins-view{ background: linear-gradient(180deg, #ffffff 0%, #f2f7fa 45%, #e6eef4 100%); color:var(--azul-oscuro); }
.pins-scroll{ position:absolute; inset:0; z-index:2; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
.pins-content{ max-width:1100px; margin:0 auto; padding: 6rem 1.5rem 6rem; }
.pins-head{ text-align:center; margin-bottom:3rem; }
.pins-stage{ background:var(--beige-neutro); border:1px solid var(--marron-oscuro);
  border-radius:1.5rem; padding:1rem; box-shadow: 0 10px 30px -12px rgba(87,71,40,.25);
  max-width:520px; margin: 0 auto 2.5rem; }
.pins-frame{ position:relative; width:100%; aspect-ratio:1/1.1; overflow:hidden;
  border-radius:1rem; background:#fff; }
.pins-frame img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:block; }

/* CAROUSEL */
.carousel-container{ position:relative; overflow:hidden; border:1px solid var(--marron-oscuro);
  border-radius:24px; padding:16px; background:#fff;
  box-shadow: 0 10px 30px -14px rgba(87,71,40,.35); margin:0 auto;
  --outer-r:24px; --p-distance:12px; user-select:none; }
.carousel-track{ display:flex; touch-action:pan-y; cursor:grab; }
.carousel-track:active{ cursor:grabbing; }
.carousel-item{ position:relative; display:flex; flex-shrink:0; flex-direction:column;
  align-items:flex-start; justify-content:flex-start; border:1px solid var(--marron-oscuro);
  border-radius: calc(var(--outer-r) - var(--p-distance)); background-color:#fff;
  overflow:hidden; will-change:transform; transform-style: preserve-3d; }
.carousel-item-header{ width:100%; padding:22px 24px 0; margin-bottom:6px; }
.carousel-icon-container{ display:flex; height:44px; width:44px; align-items:center;
  justify-content:center; border-radius:50%; background-color:var(--azul-oscuro); color:#fff;
  font-weight:800; font-size:1.1rem; letter-spacing:-0.02em;
  box-shadow: 0 6px 14px -6px rgba(40,73,87,.6); }
.carousel-item:nth-child(1) .carousel-icon-container{ background:var(--azul-oscuro); }
.carousel-item:nth-child(2) .carousel-icon-container{ background:#B08A4F; }
.carousel-item:nth-child(3) .carousel-icon-container{ background:#4E7B5A; }
.carousel-item:nth-child(4) .carousel-icon-container{ background:#2E6E8E; }
.carousel-item-content{ padding: 0 24px 26px; width:100%; }
.carousel-item-title{ margin-bottom:10px; font-weight:800; font-size:1.15rem;
  color:var(--azul-oscuro); letter-spacing:-0.01em; line-height:1.2; }
.carousel-item-section{ margin-top:12px; }
.carousel-item-label{ display:block; font-size:.66rem; font-weight:800;
  letter-spacing:.14em; text-transform:uppercase; color:var(--rosa-pastel); margin-bottom:3px; }
.carousel-item-text{ font-size:.9rem; color:var(--marron-oscuro); line-height:1.5; }
.carousel-item-text strong{ color:var(--azul-oscuro); font-weight:600; }
.carousel-indicators-container{ display:flex; width:100%; justify-content:center; margin-top:18px; }
.carousel-indicators{ display:flex; gap:10px; justify-content:center; align-items:center; }
.carousel-indicator{ height:10px; width:10px; border:none; padding:0; appearance:none;
  border-radius:50%; cursor:pointer; background-color:var(--beige-neutro);
  transition: transform 0.25s ease, background-color 0.25s ease; }
.carousel-indicator.active{ background-color:var(--azul-oscuro); transform: scale(1.35); }
.carousel-indicator:focus-visible{ outline:2px solid var(--azul-oscuro); outline-offset:2px; }

/* FLORA / FAUNA */
.nature-view{ background: linear-gradient(180deg, #ffffff 0%, #f2f7fa 45%, #e6eef4 100%); color:var(--azul-oscuro); }
.nature-scroll{ position:absolute; inset:0; z-index:2; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
.nature-content{ max-width:1200px; margin:0 auto; padding: 6rem 1.5rem 11rem; }
.nature-head{ text-align:center; margin-bottom:3rem; }
.nature-head h2{ font-size:clamp(1.8rem,4vw,2.6rem); font-weight:800;
  color:var(--azul-oscuro); letter-spacing:-0.02em; margin:1rem 0 .75rem; }
.nature-head p{ color:var(--marron-oscuro); max-width:46rem; margin:0 auto; font-size:1.02rem; }

.nature-grid{ display:grid; grid-template-columns: 1.15fr 0.85fr; gap:2.5rem; align-items:start; }
@media (max-width: 900px){ .nature-grid{ grid-template-columns: 1fr; gap:2rem; } }

.nature-section{ margin-bottom: 2.5rem; }
.nature-section:last-child{ margin-bottom: 0; }

.nature-section-header{ display:flex; align-items:center; gap:.75rem;
  padding-bottom:.9rem; margin-bottom:1.25rem; border-bottom: 3px solid; position: relative; }
.nature-section.flora .nature-section-header{ border-color:#4E7B5A; }
.nature-section.fauna .nature-section-header{ border-color:#B08A4F; }

.nature-section-icon{ display:inline-flex; align-items:center; justify-content:center;
  width:44px; height:44px; border-radius:50%; color:#fff;
  box-shadow: 0 8px 18px -8px rgba(0,0,0,.4); flex-shrink: 0; }
.nature-section.flora .nature-section-icon{ background:#4E7B5A; }
.nature-section.fauna .nature-section-icon{ background:#B08A4F; }

.nature-section-title{ font-size: 1.65rem; font-weight: 900; letter-spacing: -0.02em;
  text-transform: uppercase; line-height: 1; }
.nature-section.flora .nature-section-title{ color:#3B5F44; }
.nature-section.fauna .nature-section-title{ color:#8A6A33; }

.nature-section-sub{ display:block; font-size:.72rem; font-weight:700;
  letter-spacing:.16em; color: var(--marron-oscuro); opacity:.75;
  margin-top:.25rem; text-transform: uppercase; }

.nature-cards{ display:flex; flex-direction:column; gap:1rem; }

.nature-card{ background: #ffffff; border: 1px solid var(--marron-oscuro);
  border-radius: 1.1rem; padding: 1.25rem 1.4rem; cursor: pointer;
  transition: all .3s ease; text-align: left; font-family: inherit;
  font-size: inherit; color: inherit; width: 100%; position: relative;
  box-shadow: 0 4px 12px -10px rgba(87,71,40,.4); display: block; }
.nature-card:hover, .nature-card.active{ transform: translateY(-3px);
  box-shadow: 0 14px 30px -14px rgba(40,73,87,.45); border-color: var(--azul-oscuro); }
.nature-section.flora .nature-card.active{ border-left: 5px solid #4E7B5A;
  padding-left: calc(1.4rem - 4px); }
.nature-section.fauna .nature-card.active{ border-left: 5px solid #B08A4F;
  padding-left: calc(1.4rem - 4px); }
.nature-card-title{ font-size: 1.08rem; font-weight: 800;
  color: var(--azul-oscuro); margin-bottom: .55rem;
  letter-spacing: -0.01em; line-height: 1.25; }
.nature-card-text{ font-size: .9rem; color: var(--marron-oscuro);
  line-height: 1.55; margin-bottom: .45rem; }
.nature-card-text:last-of-type{ margin-bottom: 0; }
.nature-card-text strong{ color: var(--azul-oscuro); font-weight: 700; }
.nature-card-caption{ font-size: .7rem; color: var(--marron-oscuro);
  font-style: italic; opacity: .78; border-top: 1px dashed rgba(87,71,40,.3);
  padding-top: .55rem; margin-top: .75rem; display: block; }

.nature-right{ position: sticky; top: 6rem; }
@media (max-width: 900px){ .nature-right{ position: relative; top: 0; order: -1; } }
.nature-preview{ background: var(--beige-neutro); border: 1px solid var(--marron-oscuro);
  border-radius: 1.5rem; padding: 1rem;
  box-shadow: 0 14px 36px -16px rgba(87,71,40,.4); }
.nature-preview-frame{ position: relative; width: 100%; aspect-ratio: 4/3;
  border-radius: 1rem; overflow: hidden; background: #ffffff; }
.nature-preview-frame img{ position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block; transition: opacity .35s ease; }
.nature-preview-frame .img-fallback{ position: absolute; inset: 0;
  display:flex; align-items:center; justify-content:center;
  background: #f4eee2; color: var(--marron-oscuro);
  font-size:.85rem; padding: 1rem; text-align: center; }
.nature-preview-meta{ margin-top: 1rem; text-align: center; }
.nature-preview-label{ display: inline-block; font-size: .68rem; letter-spacing: .16em;

<body>
<div id="root"></div>

<script type="module">
import { Renderer as RendererW, Program as ProgramW, Mesh as MeshW, Triangle } from 'ogl';
import { Renderer as RendererP, Camera, Geometry, Program as ProgramP, Mesh as MeshP } from 'ogl';

const vertex = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }
`;
const fragment = `#version 300 es
precision highp float;
uniform vec2 iResolution; uniform float iTime;
uniform float uSpeed; uniform float uAmplitude;
uniform float uWaveScale; uniform float uWaveRatio;
uniform float uSwell; uniform float uTurbulence;
uniform float uTilt; uniform float uZoom; uniform float uHeight;
uniform float uFogDepth; uniform float uSteps;
uniform float uBrightness; uniform float uOpacity;
uniform float uGrain; uniform float uGrainIntensity;
uniform vec2 uMouse; uniform float uParallax; uniform bool uEnableMouse;
uniform vec3 uHorizonColor; uniform vec3 uWaveColor; uniform vec3 uCrestColor;
out vec4 fragColor;
const float MAX_DIST = 20000.0;
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
float plasma(vec3 r, vec2 freq, vec4 tc){
  float mx = r.x + tc.x; mx += uSwell * sin((r.y + mx) / 20.0 + tc.y);
  float my = r.y - tc.z; my += uTurbulence * cos(r.x / 23.0 + tc.w);
  return r.z - (sin(mx*freq.x)*uAmplitude + sin(my*freq.y)*uAmplitude + uHeight);
}
float raymarch(vec3 pos, vec3 dir, vec2 freq, vec4 tc){
  float dist = 0.0;
  for(int i=0; i<128; i++){
    if(float(i) >= uSteps) break;
    float dscene = plasma(pos + dist*dir, freq, tc);
    if(abs(dscene) < 0.1) break;
    dist += 0.9 * dscene;
    if(!(abs(dist) < MAX_DIST)) return MAX_DIST;
  }
  return dist;
}
void main(){
  float T = iTime * uSpeed;
  vec2 freq = vec2(uWaveScale/7.0, (uWaveScale*uWaveRatio)/3.0);
  vec4 tc = vec4(T/0.130, T/0.810, T/0.200, T/0.710);
  float c, s;
  float vfov = (3.14159/2.3) / max(uZoom, 0.05);
  vec3 cam = vec3(0.0, 0.0, 30.0);
  vec2 uv = (gl_FragCoord.xy / iResolution.xy) - 0.5;
  uv.x *= iResolution.x / iResolution.y;
  uv.y *= -1.0;
  vec3 dir = vec3(0.0, 0.0, -1.0);
  float ulen = length(uv);
  float xrot = vfov * ulen;
  c = cos(xrot); s = sin(xrot);
  dir = mat3(1.0,0.0,0.0, 0.0,c,-s, 0.0,s,c) * dir;
  vec2 nuv = ulen > 1e-5 ? uv/ulen : vec2(1.0, 0.0);
  c = nuv.x; s = nuv.y;
  dir = mat3(c,-s,0.0, s,c,0.0, 0.0,0.0,1.0) * dir;
  c = cos(uTilt); s = sin(uTilt);
  dir = mat3(c,0.0,s, 0.0,1.0,0.0, -s,0.0,c) * dir;
  if(uEnableMouse){
    float yaw = (uMouse.x - 0.5) * uParallax * 0.4;
    float pitch = (uMouse.y - 0.5) * uParallax * 0.4;
    c = cos(yaw); s = sin(yaw);
    dir = mat3(c,0.0,s, 0.0,1.0,0.0, -s,0.0,c) * dir;
    c = cos(pitch); s = sin(pitch);
    dir = mat3(1.0,0.0,0.0, 0.0,c,-s, 0.0,s,c) * dir;
  }
  float dist = raymarch(cam, dir, freq, tc);
  vec3 pos = cam + dist * dir;
  float t = clamp(uFogDepth / max(dist, 0.001), 0.0, 1.0);
  vec3 body = mix(uWaveColor, uCrestColor, clamp(pos.z*0.08 + 0.5, 0.0, 1.0));
  vec3 col = mix(uHorizonColor, body, t);
  col *= uBrightness;
  col = clamp(col, 0.0, 1.0);
  col = mix(uHorizonColor, col, smoothstep(0.15, 0.85, t));
  float alpha = clamp(t, 0.0, 1.0) * uOpacity;
  if(uGrain > 0.5){
    float g = hash21(gl_FragCoord.xy + mod(iTime, 64.0)*11.0);
    alpha += (g - 0.5) * uGrainIntensity;
  }
  alpha = clamp(alpha, 0.0, 1.0);
  fragColor = vec4(col * alpha, alpha);
}
`;

const hexToRgb = hex => {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? [parseInt(r[1],16)/255, parseInt(r[2],16)/255, parseInt(r[3],16)/255] : [1,1,1];
};
const detailToSteps = d => d === 'low' ? 30 : d === 'high' ? 90 : 55;
const ctxMap = new WeakMap();

const GradientWaves = ({
  horizonColor = '#5227FF', waveColor = '#FF9FFC', crestColor = '#FFFFFF',
  speed = 0.4, amplitude = 2.5, waveScale = 0.6, waveRatio = 0.9,
  swell = 35, turbulence = 20, tilt = 1.11, zoom = 1,
  height = 5.5, fogDepth = 15, detail = 'medium',
  brightness = 1, opacity = 1,
  mouseInteraction = true, parallaxStrength = 0.5,
  grain = false, grainIntensity = 0.05, className = ''
}) => {
  const containerRef = React.useRef(null);
  const enableMouseRef = React.useRef(mouseInteraction);
  React.useEffect(() => {
    const container = containerRef.current;
    if (!container) return;
    const renderer = new RendererW({
      webgl: 2, alpha: true, premultipliedAlpha: true,
      antialias: false, dpr: Math.min(window.devicePixelRatio || 1, 1.5)
    });
    const gl = renderer.gl;
    gl.clearColor(0, 0, 0, 0);
    const canvas = gl.canvas;
    canvas.style.cssText = 'width:100%;height:100%;display:block;';
    container.appendChild(canvas);
    const geometry = new Triangle(gl);
    const program = new ProgramW(gl, { vertex, fragment, uniforms: {
      iTime: { value: 0 },
      iResolution: { value: new Float32Array([1, 1]) },
      uSpeed: { value: speed }, uAmplitude: { value: amplitude },
      uWaveScale: { value: waveScale }, uWaveRatio: { value: waveRatio },
      uSwell: { value: swell }, uTurbulence: { value: turbulence },
      uTilt: { value: tilt }, uZoom: { value: zoom }, uHeight: { value: height },
      uFogDepth: { value: fogDepth }, uSteps: { value: detailToSteps(detail) },
      uBrightness: { value: brightness }, uOpacity: { value: opacity },
      uGrain: { value: grain ? 1.0 : 0.0 }, uGrainIntensity: { value: grainIntensity },
      uMouse: { value: new Float32Array([0.5, 0.5]) },
      uParallax: { value: parallaxStrength }, uEnableMouse: { value: mouseInteraction },
      uHorizonColor: { value: new Float32Array(hexToRgb(horizonColor)) },
      uWaveColor: { value: new Float32Array(hexToRgb(waveColor)) },
      uCrestColor: { value: new Float32Array(hexToRgb(crestColor)) }
    }});
    const mesh = new MeshW(gl, { geometry, program });
    ctxMap.set(container, { renderer, program, mesh });
    const setSize = () => {
      const rect = container.getBoundingClientRect();
      const w = Math.max(1, Math.floor(rect.width));
      const h = Math.max(1, Math.floor(rect.height));
      renderer.setSize(w, h);
      const res = program.uniforms.iResolution.value;
      res[0] = gl.drawingBufferWidth;
      res[1] = gl.drawingBufferHeight;
      renderer.render({ scene: mesh });
    };
    const ro = new ResizeObserver(setSize);
    ro.observe(container);
    window.addEventListener('resize', setSize);
    setSize(); requestAnimationFrame(setSize);
    const currentMouse = [0.5, 0.5]; const targetMouse = [0.5, 0.5];
    const onPointerMove = e => {
      const rect = canvas.getBoundingClientRect();
      targetMouse[0] = (e.clientX - rect.left) / rect.width;
      targetMouse[1] = 1.0 - (e.clientY - rect.top) / rect.height;
    };
    const onPointerLeave = () => { targetMouse[0] = 0.5; targetMouse[1] = 0.5; };
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerleave', onPointerLeave);
    let raf = 0; let isVisible = true; let isPageVisible = !document.hidden;
    const t0 = performance.now();
    const loop = t => {
      program.uniforms.iTime.value = (t - t0) * 0.001;
      const tx = enableMouseRef.current ? targetMouse[0] : 0.5;
      const ty = enableMouseRef.current ? targetMouse[1] : 0.5;
      currentMouse[0] += 0.05 * (tx - currentMouse[0]);
      currentMouse[1] += 0.05 * (ty - currentMouse[1]);
      program.uniforms.uMouse.value[0] = currentMouse[0];
      program.uniforms.uMouse.value[1] = currentMouse[1];
      renderer.render({ scene: mesh });
      raf = requestAnimationFrame(loop);
    };
    const tryStart = () => { if (isVisible && isPageVisible && raf === 0) raf = requestAnimationFrame(loop); };
    const tryStop = () => { if (raf !== 0) { cancelAnimationFrame(raf); raf = 0; } };
    const io = new IntersectionObserver(([e]) => { isVisible = e.isIntersecting; isVisible ? tryStart() : tryStop(); }, { threshold: 0 });
    io.observe(container);
    const onVis = () => { isPageVisible = !document.hidden; isPageVisible ? tryStart() : tryStop(); };
    document.addEventListener('visibilitychange', onVis);
    tryStart();
    return () => {
      tryStop(); ro.disconnect(); io.disconnect();
      window.removeEventListener('resize', setSize);
      document.removeEventListener('visibilitychange', onVis);
      canvas.removeEventListener('pointermove', onPointerMove);
      canvas.removeEventListener('pointerleave', onPointerLeave);
      ctxMap.delete(container);
      try { container.removeChild(canvas); } catch {}
      gl.getExtension('WEBGL_lose_context')?.loseContext();
    };
  }, []);
  return React.createElement('div', { ref: containerRef, className: `gradient-waves-container ${className}`.trim() });
};
window.GradientWaves = GradientWaves;
window.dispatchEvent(new Event('gradientwaves-ready'));

const defaultColors = ['#ffffff', '#ffffff', '#ffffff'];
const hexToRgbP = hex => {
  hex = hex.replace(/^#/, '');

/* Imagen con fallback */
const EXTS = ['.jpg', '.jpeg', '.png', '.webp', '.JPG', '.JPEG', '.PNG', '.WEBP'];
const ImageWithFallback = ({ basePath, alt }) => {
  const [idx, setIdx] = useState(0);
  const [failed, setFailed] = useState(false);
  useEffect(() => { setIdx(0); setFailed(false); }, [basePath]);
  if (failed) return <div className="img-fallback">{alt}</div>;
  return (
    <img src={basePath + EXTS[idx]} alt={alt}
      onError={() => {
        if (idx < EXTS.length - 1) setIdx(idx + 1);
        else setFailed(true);
      }} />
  );
};

/* Carousel */
const Carousel = ({ items = [], baseWidth = 640, autoplay = false,
  autoplayDelay = 5000, pauseOnHover = false }) => {
  const containerPadding = 16; const GAP = 16;
  const itemWidth = baseWidth - containerPadding * 2;
  const trackItemOffset = itemWidth + GAP;
  const [position, setPosition] = useState(0);
  const [isHovered, setIsHovered] = useState(false);
  const [dragging, setDragging] = useState(false);
  const [dragOffset, setDragOffset] = useState(0);
  const dragStartX = useRef(null);
  useEffect(() => {
    if (!autoplay || items.length <= 1) return undefined;
    if (pauseOnHover && isHovered) return undefined;
    const timer = setInterval(() => setPosition(prev => (prev + 1) % items.length), autoplayDelay);
    return () => clearInterval(timer);
  }, [autoplay, autoplayDelay, items.length, isHovered, pauseOnHover]);
  useEffect(() => { setPosition(0); }, [items.length]);
  const onPointerDown = e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragStartX.current = e.clientX; setDragging(true);
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };
  const onPointerMove = e => {
    if (!dragging || dragStartX.current === null) return;
    setDragOffset(e.clientX - dragStartX.current);
  };
  const finishDrag = () => {
    if (!dragging) return;
    const threshold = 60;
    if (dragOffset < -threshold && position < items.length - 1) setPosition(p => p + 1);
    else if (dragOffset > threshold && position > 0) setPosition(p => p - 1);
    setDragging(false); setDragOffset(0); dragStartX.current = null;
  };
  const trackOffset = -position * trackItemOffset + (dragging ? dragOffset : 0);
  return (
    <div className="carousel-container" style={{ width: baseWidth, maxWidth: '100%' }}
      onMouseEnter={() => pauseOnHover && setIsHovered(true)}
      onMouseLeave={() => pauseOnHover && setIsHovered(false)}>
      <div className="carousel-track" style={{
          gap: `${GAP}px`,
          transform: `translate3d(${trackOffset}px, 0, 0)`,
          transition: dragging ? 'none' : 'transform 0.55s cubic-bezier(0.4, 0, 0.2, 1)'
        }}
        onPointerDown={onPointerDown} onPointerMove={onPointerMove}
        onPointerUp={finishDrag} onPointerCancel={finishDrag}>
        {items.map((item, index) => {
          const diff = index - position;
          const rotateY = Math.max(-70, Math.min(70, -diff * 25));
          const hidden = Math.abs(diff) > 3;
          return (
            <div key={item.id} className="carousel-item" style={{
                width: itemWidth,
                transform: `perspective(1000px) rotateY(${rotateY}deg)`,
                transition: dragging ? 'none' : 'transform 0.55s cubic-bezier(0.4, 0, 0.2, 1)',
                opacity: hidden ? 0 : 1 }}>
              <div className="carousel-item-header">
                <span className="carousel-icon-container">{item.id}</span>
              </div>
              <div className="carousel-item-content">
                <div className="carousel-item-title">PIN {item.id}: {item.title}</div>
                <div className="carousel-item-section">
                  <span className="carousel-item-label">Ubicación en el mapa</span>
                  <span className="carousel-item-text"><strong>{item.ubicacion}</strong></span>
                </div>
                <div className="carousel-item-section">
                  <span className="carousel-item-label">Explicación del punto</span>
                  <span className="carousel-item-text">{item.explicacion}</span>
                </div>
                <div className="carousel-item-section">
                  <span className="carousel-item-label">Importancia</span>
                  <span className="carousel-item-text">{item.importancia}</span>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="carousel-indicators-container">
        <div className="carousel-indicators">
          {items.map((_, index) => (
            <button type="button" key={index}
              className={`carousel-indicator ${position === index ? 'active' : ''}`}
              aria-label={`Ir al PIN ${index + 1}`}
              aria-current={position === index}
              onClick={() => setPosition(index)} />
          ))}
        </div>
      </div>
    </div>
  );
};

/* Dock */
const Dock = ({ items = [], panelHeight = 68, baseItemSize = 56, magnification = 78 }) => {
  const [mouseX, setMouseX] = useState(null);
  const itemRefs = useRef([]);
  const handleMouseMove = e => setMouseX(e.clientX);
  const handleMouseLeave = () => setMouseX(null);
  const getScale = i => {
    if (mouseX === null) return 1;
    const el = itemRefs.current[i]; if (!el) return 1;
    const rect = el.getBoundingClientRect();
    const center = rect.left + rect.width / 2;
    const dist = Math.abs(mouseX - center);
    const maxDist = 140;
    const f = Math.max(0, 1 - dist / maxDist);
    const eased = f * f * (3 - 2 * f);
    const targetRatio = magnification / baseItemSize;
    return 1 + (targetRatio - 1) * eased;
  };
  return (
    <div className="dock" style={{ minHeight: panelHeight }}
      onMouseMove={handleMouseMove} onMouseLeave={handleMouseLeave}>
      {items.map((item, i) => {
        const scale = getScale(i);
        const size = Math.round(baseItemSize * scale);
        return (
          <button key={i} ref={el => { itemRefs.current[i] = el; }}
            type="button"
            className={`dock-item ${item.className || ''} ${item.active ? 'active' : ''}`}
            onClick={item.onClick}
            style={{ width: size, height: size }}
            aria-label={item.label}>
            {item.icon}
            <span className="dock-label">{item.label}</span>
          </button>
        );
      })}
    </div>
  );
};

        {pressed ? 'Mostrando…' : 'Presióname'}
      </button>

      <button className="back-btn" onClick={onPrev}>← Anterior</button>
      <button className="next-btn" onClick={onBack}>← Volver al inicio</button>

      <div className={`xd-overlay ${showImage ? 'show' : ''}`} aria-hidden={!showImage}>
        <div className="xd-image-wrap">
          <XDImage />
        </div>
      </div>
    </section>
  );
};

const Signature = ({ hidden }) => {
  return (
    <div className={`signature-wrap ${hidden ? 'hidden' : ''}`} aria-label="Equipo Jecad">
      <TechText
        text="Jecad"
        fontWeight={700}
        fontSize={90}
        reveal="letter"
        dashLength={4}
        dashGap={2}
        specks={10}
        color="#284957"
        accentColor="#574728"
        letterSpacing={-0.04}
        reach={90}
        softness={0.7}
        strokeWidth={1.5}
        speed={0.8}
        lineStyle="dashed"
        selection
        labels
        draggable
        sweep
        letterLabels={{
          J: 'Jesús Atuncar Martinez',
          E: 'Emily Herrera Astorayme',
          C: 'Camila Tasayco Matias',
          A: 'Alessandro Del Piero Rojas Belleza',
          D: 'Diogo Castilla Guaman'
        }}
      />
    </div>
  );
};

const App = () => {
  const [wavesReady, setWavesReady] = useState(!!window.GradientWaves);
  const [particlesReady, setParticlesReady] = useState(!!window.Particles);
  const [view, setView] = useState('hero');
  const [pixelRatio, setPixelRatio] = useState(1);

  useEffect(() => {
    setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    if (!window.GradientWaves) {
      const onW = () => setWavesReady(true);
      window.addEventListener('gradientwaves-ready', onW);
      return () => window.removeEventListener('gradientwaves-ready', onW);
    }
    if (!window.Particles) {
      const onP = () => setParticlesReady(true);
      window.addEventListener('particles-ready', onP);
      return () => window.removeEventListener('particles-ready', onP);
    }
  }, []);

  useEffect(() => {
    const t = setTimeout(() => {
      const q = document.getElementById('quote');
      if (!q) return;
      if (view !== 'hero') q.classList.remove('is-open');
      else q.classList.add('is-open');
    }, view !== 'hero' ? 0 : 1600);
    return () => clearTimeout(t);
  }, [view]);

  const showSignature = view === 'hero';

  return (
    <>
      <HeroView hidden={view !== 'hero'} wavesReady={wavesReady}
        onExplore={() => setView('map')} />

      <MapView hidden={view !== 'map'}
        onBack={() => setView('hero')}
        onNext={() => setView('pins')}
        particlesReady={particlesReady} pixelRatio={pixelRatio} />

      <PinsView hidden={view !== 'pins'}
        onPrev={() => setView('map')}
        onBack={() => setView('map')}
        onNext={() => setView('nature')} />

      <NatureView hidden={view !== 'nature'}
        onPrev={() => setView('pins')}
        onNext={() => setView('threats')} />

      <ThreatsView hidden={view !== 'threats'}
        onPrev={() => setView('nature')}
        onNext={() => setView('final')}
        onBack={() => setView('hero')} />

      <FinalView hidden={view !== 'final'}
        onPrev={() => setView('threats')}
        onBack={() => setView('hero')} />

      <Signature hidden={!showSignature} />
    </>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
